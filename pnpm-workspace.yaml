packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true

# Default catalog: single source of truth for toolchain + shared dependency
# versions. Exact pins only — bump versions here, never in package.json files.
catalog:
  # TypeScript & type checking
  typescript: 6.0.3
  vue-tsc: 3.3.7
  '@vue/tsconfig': 0.9.1
  # Lint & format
  eslint: 10.6.0
  eslint-plugin-vue: 10.9.2
  '@vue/eslint-config-typescript': 14.9.0
  '@vue/eslint-config-prettier': 10.2.0
  prettier: 3.9.4
  jiti: 2.7.0
  '@types/node': 24.13.2
  # Test
  vitest: 4.1.12
  happy-dom: 21.0.4
  '@playwright/test': 1.64.0
  '@axe-core/playwright': 4.14.0
  # Frontend core
  vue: 3.5.44
  vite: 8.1.6
  '@vitejs/plugin-vue': 6.0.7
  tailwindcss: 4.3.2
  '@tailwindcss/vite': 4.3.2
  # Frontend libraries
  '@fontsource-variable/geist': 5.3.0
  '@lucide/vue': 1.23.0
  '@vueuse/core': 14.3.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  pinia: 3.0.4
  reka-ui: 2.10.1
  tailwind-merge: 3.6.0
  tw-animate-css: 1.4.0
  vue-router: 5.1.0
  vue-sonner: 2.0.9
  # Backend / Workers
  hono: 4.13.14
  wrangler: 4.156.0
  zod: 4.6.7
  # AI SDK v6 line — npm `latest` is v7; these are the official ai-v6 dist-tag
  # versions (all on @ai-sdk/provider 3.0.15). DO NOT bump to 7.x.
  ai: 6.0.277
  '@ai-sdk/vue': 3.0.277
  '@ai-sdk/groq': 3.0.64
  '@ai-sdk/google': 3.0.121
  # MCP (Phase 6). Both are mid-split, exactly like the `ai` line: @ai-sdk/mcp
  # `latest` is 2.x, and the MCP SDK is splitting into
  # @modelcontextprotocol/{server,client}@2. Stay on these lines: @ai-sdk/mcp
  # 1.x, and SDK 1.x rather than the split packages.
  '@ai-sdk/mcp': 1.0.78
  '@modelcontextprotocol/sdk': 1.32.2

minimumReleaseAgeExclude:
  - '@ai-sdk/mcp@1.0.78'
  - '@ai-sdk/gateway@3.0.189'
  - '@ai-sdk/google@3.0.121'
  - '@ai-sdk/groq@3.0.64'
  - '@ai-sdk/provider@3.0.15'
  - '@ai-sdk/provider-utils@4.0.50'
  - '@ai-sdk/vue@3.0.277'
  - '@vue/language-core@3.3.7'
  - ai@6.0.277
  - vue-tsc@3.3.7
