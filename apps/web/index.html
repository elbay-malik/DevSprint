<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An AI copilot over a demo sprint workspace: it answers from the board, drafts release notes and runs deployments, and asks before it changes anything."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevSprint Copilot" />
    <meta property="og:title" content="DevSprint Copilot" />
    <meta
      property="og:description"
      content="A sprint copilot where nothing changes until you approve it."
    />
    <meta property="og:url" content="https://devsprint.elbaymalik.com/" />
    <meta property="og:image" content="https://devsprint.elbaymalik.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DevSprint Copilot: a screenshot of the app" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>DevSprint Copilot</title>
    <!-- Applied before first paint, mirroring src/lib/theme.ts, so a dark
         preference never shows a white page while the app loads. -->
    <script>
      try {
        var t = localStorage.getItem('devsprint-theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
        // The browser chrome follows the chosen theme too, not only the OS.
        var c = document.documentElement.classList.contains('dark') ? '#0a0a0a' : '#ffffff'
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', c)
        })
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
